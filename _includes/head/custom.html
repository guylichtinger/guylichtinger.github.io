{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Custom styling: serif font, navy accent, photo, homepage -->
<style>
:root{--accent:#1D3557;--accent-dark:#142942;--ink:#1a1a1a;}
body,.page__content,.page__content p,.page__content li,.author__name,.author__bio,.page__title,.archive__item-title,h1,h2,h3,h4,h5,h6{font-family:Georgia,"Times New Roman",Times,serif;}
.page__content{color:var(--ink);font-size:1.05em;line-height:1.75;}
.page__content a{color:var(--accent);}
.page__content a:hover{color:var(--accent-dark);}
.page__content h1,.page__content h2{color:var(--accent);}
.page__content h2{border-bottom:2px solid #d0d9e6;padding-bottom:.25em;margin-top:1.6em;}
.site-title{color:var(--accent);}
.sidebar .author__avatar img,.author__avatar img{width:100% !important;max-width:210px !important;height:auto !important;border-radius:6px !important;}
.author__name{font-size:1.2em;margin-top:.6em;}
.home-card{display:flex;gap:2.2rem;align-items:flex-start;max-width:840px;margin:2.5rem auto 0;text-align:left;}
.home-photo{width:230px;flex:0 0 230px;border-radius:6px;}
.home-text{flex:1 1 auto;}
.home-text .hero-name{display:block;font-size:2rem;font-weight:700;color:var(--accent);line-height:1.15;margin:0 0 .7rem;}
.home-text p{margin:0 0 1rem;}
.home-text .home-links{font-size:1.02em;}
@media (max-width:700px){.home-card{flex-direction:column;align-items:center;}.home-photo{width:200px;flex-basis:auto;}.home-text{width:100%;}}
.cv-actions{margin:.2rem 0 .6rem;font-size:1.05em;}
.cv-embed{width:100%;height:900px;border:1px solid #ddd;}
</style>

<!-- end custom head snippets -->
